<!DOCTYPE html>
<html>
<head>
    <title>Solicitar orçamento</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <section class="orcamento">

        <h2>Solicite seu <em>orçamento</em></h2>

        <p>
            Conte um pouco sobre seu evento e entraremos em contato.
        </p>

        <main>
            <p>Nome</p>
            <input type="text" placeholder="Digite seu nome">

            <p>Tipo de evento</p>
            <input type="text" placeholder="Digite o tipo de evento">

            <p>Data do evento</p>
            <input type="text" placeholder="DD/MM/AAAA">

            <p>E-mail</p>
            <input type="text" placeholder="Digite seu e-mail">

            <p>Mensagem</p>
            <input class="mensagem" type="text" placeholder="Conte sobre seu evento">

            <button>Solicitar orçamento</button>
        </main>

        <br>

        <a href="index.html">← Voltar para a página principal</a>

    </section>

</body>
</html>
